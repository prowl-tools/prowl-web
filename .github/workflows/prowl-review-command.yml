# Drive prowl-review from PR comments (@prowl-review review, pause, questions…) —
# keyless Codex subscription provider (#64) on the self-hosted Mac mini runner.
# No PROWL_AI_KEY_* secret reaches the runner; auth is the runner's own
# `codex login`. Mirrors the prowl-tools/prowl-code-review dogfood command
# workflow.
#
# PUBLIC-REPO CAVEAT: this is a public repo. The ubuntu `resolve` job (no
# provider secrets) computes the fork/trust verdict; the self-hosted `command`
# job's job-level same-repo gate is MANDATORY so a fork PR is never scheduled onto
# the runner. Codex itself runs `--sandbox read-only`.
name: prowl-review command

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  pull-requests: write
  issues: write
  checks: write
  contents: read

jobs:
  resolve:
    # Only PR comments (top-level or inline) from a trusted commenter
    # (owner/member/collaborator) that mention the bot; never bot comments, never
    # the bot's own summary/finding comments. This ubuntu job (no provider
    # secrets) does the fork/trust resolution so the self-hosted Codex runner
    # below is only ever scheduled for an authorized, same-repo request.
    if: |
      (github.event.issue.pull_request || github.event.pull_request) &&
      github.event.comment.user.type != 'Bot' &&
      (
        github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR'
      ) &&
      contains(github.event.comment.body, '@prowl-review') &&
      !contains(github.event.comment.body, '<!-- prowl-review:summary -->') &&
      !contains(github.event.comment.body, '<!-- prowl-review:finding ')
    runs-on: ubuntu-latest
    # No concurrency here: this hosted job has not yet re-derived the PR number
    # from GitHub's pull-request API. The self-hosted command job below
    # serializes on the server-derived `needs.resolve.outputs.pr_number`.
    outputs:
      pr_number: ${{ steps.pr.outputs.pr_number }}
      base_sha: ${{ steps.pr.outputs.base_sha }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      head_repo: ${{ steps.pr.outputs.head_repo }}
      trusted_head: ${{ steps.pr.outputs.trusted_head }}
    steps:
      - name: Resolve PR metadata
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          pr_number="${{ github.event.issue.number || github.event.pull_request.number }}"
          if [[ ! "${pr_number}" =~ ^[1-9][0-9]*$ ]]; then
            echo "Invalid command PR number: ${pr_number}" >&2
            exit 1
          fi
          IFS=$'\t' read -r base_sha head_sha head_repo < <(
            gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}" --jq '[.base.sha, .head.sha, .head.repo.full_name] | @tsv'
          )
          if [ -z "${base_sha}" ] || [ -z "${head_sha}" ] || [ -z "${head_repo}" ]; then
            echo "Failed to resolve complete PR metadata for #${pr_number}." >&2
            exit 1
          fi
          {
            echo "pr_number=${pr_number}"
            echo "base_sha=${base_sha}"
            echo "head_sha=${head_sha}"
            echo "head_repo=${head_repo}"
          } >> "$GITHUB_OUTPUT"
          if [ "${head_repo}" = "${GITHUB_REPOSITORY}" ]; then
            echo "trusted_head=true" >> "$GITHUB_OUTPUT"
          else
            echo "trusted_head=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Fork PR command skipped::Skipping command from fork PR head ${head_repo}; the self-hosted Codex runner is never scheduled for fork code."
          fi

  command:
    needs: resolve
    # Job-level same-repo gate (#64): the self-hosted Codex runner must NEVER be
    # scheduled for a fork PR. trusted_head is the same-repo verdict re-derived
    # from server-side PR metadata; the explicit head_repo == github.repository
    # check is belt-and-suspenders alongside it. MANDATORY on this public repo.
    if: >
      needs.resolve.outputs.trusted_head == 'true' &&
      needs.resolve.outputs.head_repo != '' &&
      needs.resolve.outputs.head_repo == github.repository
    # Keyless `provider: codex` runs on the always-on Mac mini (#64).
    runs-on: [self-hosted, macOS, prowl-review]
    timeout-minutes: 30
    # Shares the per-PR Codex group with auto reviews (#64) using the PR number
    # and head repository re-derived from GitHub's pull-request API, so review
    # publishing and inline finding dedupe cannot race. Machine-wide serialization
    # across repos/runner instances is the provider's Codex lock, not GitHub
    # concurrency. Keep this non-cancelling so an in-flight maintainer request is
    # never cancelled by a newer auto-review push.
    concurrency:
      group: prowl-review-codex-${{ github.repository }}-${{ needs.resolve.outputs.pr_number }}-${{ needs.resolve.outputs.head_repo }}
      queue: max
      cancel-in-progress: false
    env:
      PROWL_APP_CONFIGURED: ${{ secrets.PROWL_APP_ID != '' && secrets.PROWL_APP_PRIVATE_KEY != '' }}
    steps:
      # Branded identity: post the command reply as prowl-review[bot] when the
      # App secrets are set; falls back to github-actions[bot].
      - name: Mint prowl-review app token
        id: app-token
        if: env.PROWL_APP_CONFIGURED == 'true'
        continue-on-error: true
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.PROWL_APP_ID }}
          private-key: ${{ secrets.PROWL_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-issues: write
          permission-pull-requests: write
          permission-checks: write

      # Prefer trusted base config/guidelines; fall back to the PR config only
      # while bootstrapping onto a base branch that does not have the config yet.
      - name: Checkout trusted base (config + guidelines)
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.base_sha }}
          path: prowl-base
          persist-credentials: false

      - name: Checkout PR head for context
        if: >
          needs.resolve.outputs.trusted_head == 'true' &&
          needs.resolve.outputs.head_repo != '' &&
          needs.resolve.outputs.head_repo == github.repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.head_sha }}
          path: pr-head
          persist-credentials: false

      - name: Resolve prowl-review config
        id: review-config
        shell: bash
        run: |
          set -euo pipefail
          base_config="${GITHUB_WORKSPACE}/prowl-base/.prowl-review.yml"
          pr_config="${GITHUB_WORKSPACE}/pr-head/.prowl-review.yml"
          if [ -f "${base_config}" ]; then
            config_path="${base_config}"
          elif [ -f "${pr_config}" ]; then
            echo "::notice title=Using bootstrap config::Base branch has no .prowl-review.yml; using the PR copy."
            config_path="${pr_config}"
          else
            echo "::error title=Missing prowl-review config::No .prowl-review.yml found in the base checkout or PR checkout."
            exit 1
          fi
          echo "path=${config_path}" >> "$GITHUB_OUTPUT"

      - name: prowl-review command
        # Temporary SHA pin: current v1 lacks the Codex provider, so keep the
        # reviewed Codex-capable commit until prowl-code-review publishes a
        # stable Codex-capable tag. Re-check monthly and migrate to that tag.
        uses: prowl-tools/prowl-code-review@e7f0431b7daf2cc818a003c5ac216f29e7da3c53
        env:
          PROWL_REVIEWED_HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
          PROWL_REVIEWED_HEAD_REPOSITORY: ${{ needs.resolve.outputs.head_repo }}
        with:
          mode: command
          # Keyless Codex subscription provider (#64): no PROWL_AI_KEY_* secret
          # reaches this self-hosted job. Model + effort are pinned in the trusted
          # base-branch config; ai-provider is passed explicitly so an
          # @prowl-review command runs on the same keyless provider as the auto
          # review.
          ai-provider: codex
          config-path: ${{ steps.review-config.outputs.path }}
          workspace-path: ${{ github.workspace }}/pr-head
          guidelines-path: ${{ github.workspace }}/prowl-base
          # Branded App token when configured; otherwise the default Actions token.
          github-token: ${{ steps.app-token.outputs.token || github.token }}
          bot-login: ${{ steps.app-token.outputs.app-slug != '' && format('{0}[bot]', steps.app-token.outputs.app-slug) || '' }}
