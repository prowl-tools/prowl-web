name: homepage
description: Homepage leads with the desktop-first CLI story and its key sections render
tags:
  - smoke
  - full

steps:
  - navigate: "/"

  - waitForNetworkIdle:
      timeout: 5000

  - assert:
      visible: "End-to-end tests for your Mac and web apps"

  - assert:
      visible: "Change the target, not the test"

  - assert:
      visible: "How it works"

  - assert:
      visible: "Built for AI-assisted development"

  # Slim comparison teaser (replaced the full "Desktop and web from the same
  # file" table section, 2026-09-12) — links to the dedicated /compare page.
  - assert:
      visible: "How does Prowl compare?"

assertions:
  - selectorExists: "h1"
  - selectorExists: "a[href='/compare']"
  - selectorNotExists: ":nth-match(h1, 2)"
  - selectorExists: "#how-it-works"
  - selectorExists: "a[href^='https://docs.prowl.tools']"
  - selectorExists: "a[href='https://github.com/prowl-tools/prowl']"
  # PQW-025: no retired product links anywhere on the page.
  - selectorNotExists: "a[href*='hub.prowl.tools']"
  - selectorNotExists: "a[href*='infra.prowl.tools']"
  - selectorNotExists: "a[href*='review.prowl.tools']"
  - noConsoleErrors: true
